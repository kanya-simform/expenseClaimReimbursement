server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router's client-side routes (e.g. /claims, /approvals) have no matching file on
    # disk — fall back to index.html and let the app's own router handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
